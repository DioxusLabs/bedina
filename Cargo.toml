[workspace]
resolver = "2"
members = ["examples/dioxus-native-in-bevy", "examples/bevy-in-dioxus-native"]

[workspace.package]
version = "0.7.5"

# dependencies that are shared across packages
[workspace.dependencies]
wgpu = { version = "30.0.1" }

bevy = { version = "0.20.0" }

dioxus = { version = "0.8.0-alpha.2", default-features = false }
dioxus-asset-resolver = { version = "0.8.0-alpha.2" }
dioxus-devtools = { version = "0.8.0-alpha.2" }

blitz-dom = { version = "0.3.0-beta.3", default-features = false }
blitz-paint = { version = "0.3.0-beta.3" }
blitz-traits = { version = "0.3.0-beta.3" }
dioxus-native = { version = "0.8.0-alpha.2" }
dioxus-native-dom = { version = "0.8.0-alpha.2" }
data-url = "0.3.2"

anyrender = { version = "0.14", default-features = false }
anyrender_vello = { version = "0.15", default-features = false }
vello = { version = "0.11", default-features = false }

color = "0.3.2"
peniko = "0.6.1"
tracing-subscriber = { version = "0.3.20", default-features = false }
bytes = "1.10.1"
async-std = "1.13.1"
crossbeam-channel = "0.5"
paste = "1.0.12"
rustc-hash = "2.1.1"
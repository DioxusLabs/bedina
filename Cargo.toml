[workspace]
resolver = "2"
members = ["examples/dioxus-native-in-bevy", "examples/bevy-in-dioxus-native"]

[workspace.package]
version = "0.7.5"

# dependencies that are shared across packages
[workspace.dependencies]
wgpu = { version = "29.0.3" }

bevy = { version = "0.19.0-rc.1" }

dioxus = { version = "0.7.8", default-features = false }
dioxus-asset-resolver = { version = "0.7.8" }
dioxus-devtools = { version = "0.7.8" }

blitz-dom = { git = "https://github.com/dioxuslabs/blitz", rev = "3c7b62b5ad7a6e6ae044324893a9f422923d68b9", default-features = false }
blitz-paint = { git = "https://github.com/dioxuslabs/blitz", rev = "3c7b62b5ad7a6e6ae044324893a9f422923d68b9" }
blitz-traits = { git = "https://github.com/dioxuslabs/blitz", rev = "3c7b62b5ad7a6e6ae044324893a9f422923d68b9" }
dioxus-native = { git = "https://github.com/dioxuslabs/blitz", rev = "3c7b62b5ad7a6e6ae044324893a9f422923d68b9" }
dioxus-native-dom = { git = "https://github.com/dioxuslabs/blitz", rev = "3c7b62b5ad7a6e6ae044324893a9f422923d68b9" }
data-url = "0.3.2"

anyrender = { version = "0.10", default-features = false }
anyrender_vello = { version = "0.10.1", default-features = false }
vello = { version = "0.9", default-features = false }

color = "0.3.2"
peniko = "0.6.0"
tracing-subscriber = { version = "0.3.20", default-features = false }
bytes = "1.10.1"
async-std = "1.13.1"
crossbeam-channel = "0.5"
paste = "1.0.12"
rustc-hash = "2.1.1"